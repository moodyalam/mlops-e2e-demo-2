name: CI Pipeline

# Run on every push to main, on every pull request, and when started by hand
# from the Actions tab. (Listing every branch under "push" would run twice for
# a pull request: once for the push and once for the pull request.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The pipeline only needs to read the code, so give it the minimum permission.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip                              # reuse downloaded packages between runs
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/test_1_unit.py

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests                             # only starts if unit-tests passed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run integration tests
        run: pytest tests/test_2_integration.py

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests                      # only starts if integration-tests passed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt   # the tests (pytest, requests) run on the runner
      - name: Build Docker image
        run: docker build -t mlapp .
      - name: Start the container
        run: docker run -d --name mlapp -p 8000:8000 mlapp
      - name: Run end-to-end tests against the container
        # The tests wait for /health to answer before they start, so no fixed sleep is needed.
        run: pytest tests/test_3_e2e.py
        env:
          BASE_URL: http://127.0.0.1:8000
      - name: Show container logs (only if something failed)
        if: failure()
        run: docker logs mlapp
